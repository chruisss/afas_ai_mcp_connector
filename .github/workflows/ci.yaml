# Checks every pull request and every push to main. The same commands are listed in AGENTS.md,
# so a green run here means the same as a green run on a developer's machine.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC: a dependency can turn out to be vulnerable without the code changing.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.7"

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Lockfile matches pyproject.toml
        run: uv lock --check
      - name: Format
        run: uv run --frozen ruff format --check src tests
      - name: Lint
        run: uv run --frozen ruff check src tests
      - name: Types
        run: uv run --frozen ty check src

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Tests with coverage
        run: uv run --frozen --python ${{ matrix.python }} pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Known vulnerabilities in the locked runtime dependencies
        run: scripts/audit.sh

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, start and probe the image
        run: scripts/smoke-test.sh
