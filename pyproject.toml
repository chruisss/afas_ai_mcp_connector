[project]
name = "afas_mcp_server"
version = "0.1.0"
description = "MCP server for AFAS Profit that every user logs in to with AFAS OAuth 2.0"
readme = "README.md"
authors = [
    {name = "Chris Schrijver", email = "chris@tjermo.nl"},
    # Author of the original project this one was forked from.
    {name = "Ellert van der Vecht"},
]
requires-python = ">=3.11"
dependencies = [
    # Encrypts the stored AFAS tokens of logged-in users.
    "cryptography>=50.0.0",
    "httpx2>=2.13.0",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # Request and response types of the login pages; the MCP SDK serves HTTP with it.
    "starlette>=1.0.0",
    "typing-extensions>=4.16.0",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    # Python versions supported by the package
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
afas-mcp-server = "afas_mcp_server.__main__:main"

[project.urls]
Homepage = "https://github.com/chruisss/afas_ai_mcp_connector"
Documentation = "https://github.com/chruisss/afas_ai_mcp_connector/tree/main/docs"
"Original project" = "https://github.com/schubergphilis/afas_mcp_server"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.4",
    "ty==0.0.101",
]

[build-system]
requires = ["uv_build>=0.8.15,<=0.13.7"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "scratch",
]
# Black's default of 88 quickly feels overly restricted.
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstring style conflicts (pick one from each pair)
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    # Copyright headers are intentionally not added to source files
    # This will change when automated tools start doing something with them
    "CPY001",  # missing-copyright-notice
    # Modules import what they use at runtime; typing-only import blocks hide real dependencies.
    "TC001",   # typing-only-first-party-import
    "TC002",   # typing-only-third-party-import
    "TC003",   # typing-only-standard-library-import
    # A list of common ignores, uncomment or remove at your discretion
    # "D105",    # undocumented-magic-method
    # "D107",    # undocumented-public-init
    # "TRY003",  # raise-vanilla-args
    # "EM101",   # raw-string-in-exception
    # "EM102",   # f-string-in-exception
    # "BLE001",  # blind-exception (legitimate in network code)
    # "FBT001",  # boolean-type-hint-positional-argument
    # "FBT002",  # boolean-default-value-positional-argument
    # "PLR0912", # too-many-branches
    # "PLR0913", # too-many-arguments
    # "PLR0915", # too-many-statements
    # "C901",    # complex-structure
    # "PLC0415", # import-outside-toplevel (used intentionally)
    # "ANN002",  # missing-type-args
    # "ANN003",  # missing-type-kwargs
    # "ANN401",  # dynamically-typed-expression (Any in **kwargs is legitimate)
    # "TD",      # todo comments
    # "FIX",     # fixme comments
    # "ERA",     # commented-out code
    # Formatter conflicts
    "COM812",  # missing-trailing-comma (conflicts with formatter)
    "Q000",    # bad-quotes-inline-string (conflicts with format.quote-style)
    "Q003",
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S311", "RUF012", "PLR2004", "S105", "S106"]
"src/*.py" = ["UP038"]
# MCP tools are flat keyword surfaces for a model; bundling their arguments into objects would only hide them.
"src/afas_mcp_server/server.py" = ["PLR0913"]

[tool.ruff.format]
# Use single quotes for strings, because that is more readable.
quote-style = "single"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

[tool.pytest.ini_options]
addopts = ["--strict-markers", "--cov", "--cov-report=term-missing"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "@overload",
]
